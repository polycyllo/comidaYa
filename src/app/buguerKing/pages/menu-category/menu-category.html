<div class="flex items-center justify-center">
  <img src="menu/logo-menu.png" alt="logo-menu-image" class="w-1/3 py-5" />
</div>

<ul class="flex scrollbar-none overflow-x-auto px-5 font-fredoka text-brown-20">
  @for (category of categories(); track category.id) {
    <menu-category-cards [imageUrl]="category.img" [label]="category.title" />
  }
</ul>

<section class="space-y-8 px-5 py-6">
  @for (category of categories(); track category.id) {
    @let products = productsFor(category.id);
    @if (products.length) {
      <section>
        <p class="font-fredoka text-xl font-extrabold text-brown-20">{{ category.title }}</p>
        <div class="mt-3 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
          @for (product of products; track product.id) {
            <app-menu-card [item]="product" />
          }
        </div>
      </section>
    }
  }
</section>
