<article
  class="my-2 w-[200px] overflow-hidden rounded-4xl transition-transform duration-300 hover:scale-105"
>
  <div>
    <img
      [src]="item().img"
      [alt]="item().title"
      class="h-full w-full object-contain hover:shadow-xl"
    />
  </div>
  <h3 class="mt-3 text-center font-serif font-bold text-brown">{{ item().title }}</h3>
</article>
