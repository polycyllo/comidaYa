<article
  class=" w-full max-w-[205px] overflow-hidden  transition-transform duration-300 cursor-pointer md:flex md:flex-col md:justify-between"
>
  @if (item().img; as imageUrl) {
    <div >
      <img
        [src]="imageUrl"
        [alt]="item().title"
        class="h-full w-full object-contain"
      />
    </div>
    <h3 class="mt-3 text-center font-serif font-bold text-brown">{{ item().title }}</h3>
  } @else {
    <h3
      class="flex min-h-32 items-center justify-center bg-white px-4 text-center font-serif font-bold text-brown"
    >
      {{ item().title }}
    </h3>
  }
</article>
