<article
  class="my-2 w-full max-w-[205px] overflow-hidden rounded-4xl transition-transform duration-300 hover:scale-105"
>
  @if (item().img; as imageUrl) {
    <div>
      <img
        [src]="imageUrl"
        [alt]="item().title"
        class="h-full w-full object-contain hover:shadow-xl"
      />
    </div>
    <h3 class="mt-3 text-center font-serif font-bold text-brown">{{ item().title }}</h3>
  } @else {
    <h3
      class="flex min-h-32 items-center justify-center rounded-4xl bg-white px-4 text-center font-serif font-bold text-brown"
    >
      {{ item().title }}
    </h3>
  }
</article>
