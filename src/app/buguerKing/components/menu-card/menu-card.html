<article
  class="w-full max-w-[205px] rounded-4xl overflow-hidden hover:scale-105 transition-transform duration-300 my-2"
>
  <div>
    <img
      [src]="item().img"
      [alt]="item().title"
      class="h-full w-full object-contain hover:shadow-xl"
    />
  </div>
  <h3 class="mt-3 text-center font-serif font-bold text-brown">{{ item().title }}</h3>
</article>
